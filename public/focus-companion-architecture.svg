<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="540" fill="#020617"/>
  <text x="50%" y="60" text-anchor="middle" fill="#E5E7EB" font-size="24" font-family="system-ui, -apple-system">Focus Companion Architecture</text>

  <rect x="60" y="120" width="260" height="360" rx="20" fill="#020617" stroke="#1E293B"/>
  <text x="190" y="150" text-anchor="middle" fill="#F9FAFB" font-size="16" font-family="system-ui">Client (Next.js App Router)</text>

  <rect x="80" y="180" width="220" height="60" rx="12" fill="#0F172A" stroke="#1F2937"/>
  <text x="190" y="215" text-anchor="middle" fill="#E5E7EB" font-size="14">CalendarWeek component</text>

  <rect x="80" y="260" width="220" height="60" rx="12" fill="#0F172A" stroke="#1F2937"/>
  <text x="190" y="295" text-anchor="middle" fill="#E5E7EB" font-size="14">Session list &amp; room links</text>

  <rect x="80" y="340" width="220" height="60" rx="12" fill="#0F172A" stroke="#1F2937"/>
  <text x="190" y="375" text-anchor="middle" fill="#E5E7EB" font-size="14">VideoRoom (You + Nova)</text>

  <rect x="360" y="180" width="240" height="120" rx="16" fill="#020617" stroke="#1E293B"/>
  <text x="480" y="210" text-anchor="middle" fill="#F9FAFB" font-size="16">API Routes</text>
  <text x="480" y="235" text-anchor="middle" fill="#E5E7EB" font-size="14">/api/sessions</text>
  <text x="480" y="255" text-anchor="middle" fill="#E5E7EB" font-size="14">/api/sessions/[id]</text>
  <text x="480" y="275" text-anchor="middle" fill="#E5E7EB" font-size="14">/api/auth/[...nextauth]</text>

  <rect x="360" y="340" width="240" height="100" rx="16" fill="#020617" stroke="#1E293B"/>
  <text x="480" y="370" text-anchor="middle" fill="#F9FAFB" font-size="16">Auth &amp; Sessions</text>
  <text x="480" y="395" text-anchor="middle" fill="#E5E7EB" font-size="14">NextAuth (credentials)</text>
  <text x="480" y="415" text-anchor="middle" fill="#E5E7EB" font-size="14">JWT-based session</text>

  <rect x="650" y="220" width="250" height="160" rx="20" fill="#020617" stroke="#1E293B"/>
  <text x="775" y="250" text-anchor="middle" fill="#F9FAFB" font-size="16">Database</text>
  <text x="775" y="275" text-anchor="middle" fill="#E5E7EB" font-size="14">Prisma ORM</text>
  <text x="775" y="295" text-anchor="middle" fill="#E5E7EB" font-size="14">SQLite (dev.db)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#38BDF8" />
    </marker>
  </defs>

  <line x1="300" y1="210" x2="360" y2="220" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="300" y1="290" x2="360" y2="230" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="600" y1="230" x2="650" y2="260" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="600" y1="380" x2="650" y2="320" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)" />
</svg>
